name: Test base-ref input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup mock atmos in PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          python3 << 'PYEOF'
          import os, stat
          script = r"""#!/bin/bash
          case "$1" in
            describe)
              case "$2" in
                affected)
                  output_file="affected-stacks.json"
                  for arg in "$@"; do
                    case "$arg" in
                      --file=*) output_file="${arg#--file=}" ;;
                    esac
                  done
                  echo '[]' > "$output_file"
                  ;;
                config)
                  echo '{"integrations":{"github":{"gitops":{"opentofu-version":null,"terraform-version":null,"artifact-storage":{"region":null},"role":{"plan":null},"matrix":{"sort-by":null,"group-by":null}}}}}'
                  ;;
                *)
                  echo '{}'
                  ;;
              esac
              ;;
            *)
              exit 0
              ;;
          esac
          """
          path = os.path.expandvars("$HOME/.local/bin/atmos")
          with open(path, "w") as f:
              f.write(script)
          os.chmod(path, stat.S_IRWXU | stat.S_IRGRP | stat.S_IXGRP | stat.S_IROTH | stat.S_IXOTH)
          PYEOF
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup base-ref git directory with explicit ref
        run: |
          # Create a base-ref directory at HEAD (same commit = no changes)
          git clone --local --no-hardlinks "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/base-ref"

      - id: action
        uses: .
        with:
          atmos-config-path: >-
            ${{ github.workspace }}/hardened/tests/fixtures/atmos-config
          skip-checkout: "true"
          install-atmos: "false"
          nested-matrices-count: "1"
          base-ref: "HEAD"

      - name: Assert has-affected-stacks output is valid boolean
        env:
          HAS_AFFECTED: ${{ steps.action.outputs.has-affected-stacks }}
        run: |
          echo "has-affected-stacks: $HAS_AFFECTED"
          if [ "$HAS_AFFECTED" != "true" ] && [ "$HAS_AFFECTED" != "false" ]; then
            echo "FAIL: expected has-affected-stacks to be 'true' or 'false', got: '$HAS_AFFECTED'"
            exit 1
          fi
          echo "PASS: has-affected-stacks=$HAS_AFFECTED"

      - name: Assert affected output is valid JSON array
        env:
          AFFECTED: ${{ steps.action.outputs.affected }}
        run: |
          echo "affected: $AFFECTED"
          if [ -z "$AFFECTED" ]; then
            echo "FAIL: expected affected output to be non-empty (should be at least '[]')"
            exit 1
          fi
          echo "$AFFECTED" | jq . > /dev/null 2>&1 || {
            echo "FAIL: affected output is not valid JSON: $AFFECTED"
            exit 1
          }
          echo "PASS: affected output is valid JSON"

      - name: Assert matrix output exists
        env:
          MATRIX: ${{ steps.action.outputs.matrix }}
        run: |
          echo "matrix: $MATRIX"
          if [ -z "$MATRIX" ]; then
            echo "FAIL: expected matrix output to be non-empty"
            exit 1
          fi
          echo "PASS: matrix output is present"
