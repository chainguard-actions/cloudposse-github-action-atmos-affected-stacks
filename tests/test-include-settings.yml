name: Test atmos-include-settings flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Set up a base-ref directory pointing to the same commit (no changes expected)
      - name: Set up base-ref directory for atmos describe affected
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git worktree add "$GITHUB_WORKSPACE/base-ref" HEAD

      - id: action
        uses: .
        with:
          atmos-config-path: >-
            ${{ github.workspace }}/tests/fixtures/atmos-config
          skip-checkout: "true"
          install-atmos: "true"
          atmos-version: ">= 1.99.0"
          atmos-include-settings: "true"
          nested-matrices-count: "1"

      - name: Assert action completed and outputs are set
        env:
          HAS_AFFECTED: ${{ steps.action.outputs.has-affected-stacks }}
          AFFECTED: ${{ steps.action.outputs.affected }}
          MATRIX: ${{ steps.action.outputs.matrix }}
        run: |
          echo "has-affected-stacks: $HAS_AFFECTED"
          echo "affected: $AFFECTED"
          echo "matrix: $MATRIX"

          # has-affected-stacks must be a boolean string
          if [ "$HAS_AFFECTED" != "true" ] && [ "$HAS_AFFECTED" != "false" ]; then
            echo "FAIL: expected has-affected-stacks to be 'true' or 'false', got: '$HAS_AFFECTED'"
            exit 1
          fi

          # affected must be a valid JSON array
          if ! echo "$AFFECTED" | jq -e '. | type == "array"' > /dev/null 2>&1; then
            echo "FAIL: expected affected to be a JSON array, got: '$AFFECTED'"
            exit 1
          fi

          # matrix must be non-empty
          if [ -z "$MATRIX" ]; then
            echo "FAIL: expected matrix output to be non-empty"
            exit 1
          fi

          echo "PASS: all outputs are set correctly"
