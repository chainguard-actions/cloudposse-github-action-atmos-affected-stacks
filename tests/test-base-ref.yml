name: Test base-ref input - explicit base ref
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up base-ref worktree at HEAD (same commit = no affected stacks)
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Use git worktree to create base-ref as a proper git worktree at HEAD
          git worktree add "$GITHUB_WORKSPACE/base-ref" HEAD

      - name: Get current HEAD SHA for base-ref input
        id: head-sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - id: action
        uses: .
        with:
          skip-checkout: "true"
          base-ref: ${{ steps.head-sha.outputs.sha }}
          atmos-config-path: "${{ github.workspace }}/tests/fixtures/atmos-config"
          install-atmos: "true"
          atmos-version: ">= 1.99.0"
          nested-matrices-count: "1"

      - name: Assert has-affected-stacks output is set
        env:
          HAS_AFFECTED: ${{ steps.action.outputs.has-affected-stacks }}
        run: |
          echo "has-affected-stacks: $HAS_AFFECTED"
          if [ -z "$HAS_AFFECTED" ]; then
            echo "FAIL: has-affected-stacks output is empty"
            exit 1
          fi
          echo "PASS: has-affected-stacks=$HAS_AFFECTED"

      - name: Assert affected output is set
        env:
          AFFECTED: ${{ steps.action.outputs.affected }}
        run: |
          echo "affected: $AFFECTED"
          if [ -z "$AFFECTED" ]; then
            echo "FAIL: affected output is empty"
            exit 1
          fi
          echo "PASS: affected=$AFFECTED"

      - name: Assert matrix output is set
        env:
          MATRIX: ${{ steps.action.outputs.matrix }}
        run: |
          echo "matrix: $MATRIX"
          if [ -z "$MATRIX" ]; then
            echo "FAIL: matrix output is empty"
            exit 1
          fi
          echo "PASS: matrix=$MATRIX"

      - name: Assert no affected stacks (same commit as base-ref)
        env:
          HAS_AFFECTED: ${{ steps.action.outputs.has-affected-stacks }}
        run: |
          echo "has-affected-stacks: $HAS_AFFECTED"
          if [ "$HAS_AFFECTED" != "false" ]; then
            echo "FAIL: expected has-affected-stacks=false when base-ref equals HEAD, got '$HAS_AFFECTED'"
            exit 1
          fi
          echo "PASS: no affected stacks as expected when base-ref=HEAD"
