name: Test base-ref input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up mock atmos binary
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/atmos" << 'EOF'
          #!/bin/bash
          case "$1" in
            describe)
              case "$2" in
                affected)
                  output_file="affected-stacks.json"
                  for arg in "$@"; do
                    case "$arg" in
                      --file=*) output_file="${arg#--file=}" ;;
                    esac
                  done
                  echo '[]' > "$output_file"
                  ;;
                config)
                  echo '{"integrations":{"github":{"gitops":{"opentofu-version":null,"terraform-version":null,"artifact-storage":{"region":null},"role":{"plan":null},"matrix":{"sort-by":null,"group-by":null}}}}}'
                  ;;
                *)
                  echo '{}'
                  ;;
              esac
              ;;
            *)
              exit 0
              ;;
          esac
          EOF
          chmod +x "$HOME/.local/bin/atmos"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up base-ref directory with a named branch
        run: |
          # Create a local bare-style clone as base-ref directory
          # We need a git repo in base-ref that has a branch we can checkout by name
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create base-ref as a worktree on a new branch so we can checkout by ref
          git branch base-test-branch HEAD 2>/dev/null || true
          mkdir -p "$GITHUB_WORKSPACE/base-ref"
          git worktree add "$GITHUB_WORKSPACE/base-ref" base-test-branch 2>/dev/null || \
            git worktree add --force "$GITHUB_WORKSPACE/base-ref" HEAD

      - id: action
        uses: .
        with:
          skip-checkout: "true"
          base-ref: "base-test-branch"
          atmos-config-path: >-
            ${{ github.workspace }}/hardened/tests/fixtures/atmos-config
          install-atmos: "false"
          nested-matrices-count: "1"

      - name: Assert has-affected-stacks output is valid boolean
        env:
          HAS_AFFECTED: ${{ steps.action.outputs.has-affected-stacks }}
        run: |
          echo "has-affected-stacks: $HAS_AFFECTED"
          if [ "$HAS_AFFECTED" != "true" ] && [ "$HAS_AFFECTED" != "false" ]; then
            echo "FAIL: expected has-affected-stacks to be 'true' or 'false', got: '$HAS_AFFECTED'"
            exit 1
          fi
          echo "PASS: has-affected-stacks is a valid boolean: $HAS_AFFECTED"

      - name: Assert affected output is valid JSON
        env:
          AFFECTED: ${{ steps.action.outputs.affected }}
        run: |
          echo "affected: $AFFECTED"
          if [ -z "$AFFECTED" ]; then
            echo "FAIL: expected affected output to be non-empty (should be at least '[]')"
            exit 1
          fi
          echo "$AFFECTED" | jq . > /dev/null 2>&1 || {
            echo "FAIL: affected output is not valid JSON: $AFFECTED"
            exit 1
          }
          echo "PASS: affected output is valid JSON"

      - name: Assert matrix output exists
        env:
          MATRIX: ${{ steps.action.outputs.matrix }}
        run: |
          echo "matrix: $MATRIX"
          if [ -z "$MATRIX" ]; then
            echo "FAIL: expected matrix output to be non-empty"
            exit 1
          fi
          echo "PASS: matrix output is present"
